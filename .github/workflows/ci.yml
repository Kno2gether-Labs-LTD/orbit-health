name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default: CI never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only main writes the cache; pull requests read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests (ring protocol, app, server)
        run: ./gradlew --no-daemon test

      - name: Build the app (debug and release) and the server
        # Release builds are unsigned here: the signing key never leaves the maintainers' machines.
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :server:installDist

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 14

      - name: Upload the debug APK
        # Every merge to main produces an installable debug build for testers.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: OrbitHealth-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
