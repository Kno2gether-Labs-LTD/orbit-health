<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Orbit Health: your ring, your data, on your phone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241a6b"/><stop offset=".55" stop-color="#0f0b33"/><stop offset="1" stop-color="#0a0820"/></linearGradient>
    <radialGradient id="glow" cx=".22" cy=".5" r=".42"><stop offset="0" stop-color="#8b6bff" stop-opacity=".38"/><stop offset="1" stop-color="#8b6bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="dawn" cx=".8" cy="1.25" r=".7"><stop offset="0" stop-color="#ff7eb6" stop-opacity=".28"/><stop offset="1" stop-color="#ff7eb6" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9a6ff"/><stop offset=".5" stop-color="#8b6bff"/><stop offset="1" stop-color="#ff7eb6"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9a6ff"/><stop offset="1" stop-color="#ff7eb6"/></linearGradient>
    <radialGradient id="planet" cx=".35" cy=".3"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#ffd1ea"/><stop offset="1" stop-color="#ff7eb6"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>
  <rect width="1280" height="420" fill="url(#dawn)"/>
  <g fill="#fff" opacity=".55">
    <circle cx="96" cy="64" r="1.2"/><circle cx="420" cy="48" r="1"/><circle cx="610" cy="92" r="1.4"/><circle cx="880" cy="40" r="1"/>
    <circle cx="1040" cy="110" r="1.3"/><circle cx="1210" cy="62" r="1"/><circle cx="1160" cy="330" r="1.1"/><circle cx="760" cy="360" r="1"/>
    <circle cx="520" cy="380" r="1.2"/><circle cx="60" cy="360" r="1"/><circle cx="980" cy="250" r="0.9"/><circle cx="1240" cy="200" r="1.2"/>
  </g>
  <g transform="translate(270 210)">
    <circle r="96" fill="none" stroke="url(#ring)" stroke-width="54" opacity=".35" filter="url(#soft)"/>
    <circle r="96" fill="none" stroke="url(#ring)" stroke-width="54"/>
    <circle cx="68" cy="-68" r="22" fill="url(#planet)"/>
    <circle cx="68" cy="-68" r="34" fill="#ff7eb6" opacity=".25" filter="url(#soft)"/>
  </g>
  <text x="470" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#fff" font-weight="700">Orbit</text>
  <text x="742" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-style="italic" font-weight="300" fill="url(#word)">Health</text>
  <text x="474" y="272" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#d9d2ff" opacity=".9">Your ring. Your data. On your phone,</text>
  <text x="474" y="310" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#d9d2ff" opacity=".9">and nowhere else unless you say so.</text>
</svg>
